        class SoundController {
            constructor() { this.ctx = null; this.heartbeatInterval = null; this.musicInterval = null; }
            init() {
                if (!this.ctx) {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    this.ctx = new AudioContext();
                }
                if (this.ctx.state === 'suspended') this.ctx.resume();
            }
            playTone(freq, type, duration, vol = 0.1) {
                try {
                    this.init();
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    osc.type = type;
                    osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
                    gain.gain.setValueAtTime(vol, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);
                    osc.connect(gain); gain.connect(this.ctx.destination);
                    osc.start(); osc.stop(this.ctx.currentTime + duration);
                } catch(e) {}
            }
            playSuccess() {
                this.playTone(523.25, 'triangle', 0.1, 0.2);
                setTimeout(() => this.playTone(659.25, 'triangle', 0.1, 0.2), 100);
                setTimeout(() => this.playTone(783.99, 'triangle', 0.2, 0.2), 200);
            }
            playError() {
                this.playTone(200, 'sawtooth', 0.2, 0.2);
                setTimeout(() => this.playTone(150, 'sawtooth', 0.3, 0.2), 150);
            }
            playClick() { this.playTone(400, 'sine', 0.05, 0.05); }
            startHeartbeat(speedMs = 1000) {
                this.stopHeartbeat();
                this.heartbeatInterval = setInterval(() => {
                    this.playTone(80, 'sine', 0.08, 0.4);
                    setTimeout(() => this.playTone(120, 'sine', 0.08, 0.3), 120);
                }, speedMs);
            }
            stopHeartbeat() {
                if (this.heartbeatInterval) { clearInterval(this.heartbeatInterval); this.heartbeatInterval = null; }
            }
            startBGM(worldId = 1, missionId = 1) {
                this.stopBGM();
                const worldMelodies = {
                    1: [261.63, 329.63, 392.00, 523.25, 392.00, 329.63], // Mundo 1
                    2: [293.66, 369.99, 440.00, 587.33, 440.00, 369.99], // Mundo 2
                    3: [329.63, 392.00, 493.88, 659.25, 493.88, 392.00], // Mundo 3
                    4: [349.23, 440.00, 523.25, 698.46, 523.25, 440.00], // Mundo 4
                    5: [392.00, 493.88, 587.33, 783.99, 587.33, 493.88], // Mundo 5
                    6: [440.00, 554.37, 659.25, 880.00, 659.25, 554.37], // Mundo 6
                    7: [261.63, 349.23, 440.00, 523.25, 440.00, 349.23], // Mundo 7
                    8: [293.66, 392.00, 493.88, 587.33, 493.88, 392.00], // Mundo 8
                    9: [329.63, 440.00, 587.33, 659.25, 587.33, 440.00]  // Mundo 9
                };
                let notes = worldMelodies[worldId] || worldMelodies[1];
                const shift = (missionId - 1) * 12;
                notes = notes.map(n => n + shift);
                let idx = 0;
                this.musicInterval = setInterval(() => {
                    this.playTone(notes[idx], 'sine', 0.22, 0.018);
                    idx = (idx + 1) % notes.length;
                }, 400);
            }
            stopBGM() {
                if (this.musicInterval) { clearInterval(this.musicInterval); this.musicInterval = null; }
            }
        }

                this.saveProfiles();
                this.sound.playSuccess();
                this.selectProfile(newProfile.id);

            selectProfile(profileId) {
                this.sound.playClick();
                this.currentProfile = this.profiles.find(p => p.id === profileId);

                document.getElementById('main-header').classList.remove('hidden');
                document.getElementById('current-profile-badge').innerText = `Perfil: ${this.currentProfile.name}`;

                this.showWorldMap();

            isWorldCompleted(worldId) {
                const world = WORLDS_DATABASE.find(w => w.id === worldId);
                if (!world || !this.currentProfile.completedMissions) return false;
                return world.missions.every(m => this.currentProfile.completedMissions[`w${worldId}_m${m.id}`]);
            }

            isMissionCompleted(worldId, missionId) {
                return this.currentProfile.completedMissions && this.currentProfile.completedMissions[`w${worldId}_m${missionId}`];
            }

            markMissionCompleted(worldId, missionId) {
                if (!this.currentProfile.completedMissions) this.currentProfile.completedMissions = {};
                this.currentProfile.completedMissions[`w${worldId}_m${missionId}`] = true;
                this.saveProfiles();

                                <h2 class="font-display font-extrabold text-2xl md:text-3xl text-white mt-1">Selecciona un Mundo Educativo</h2>
                                <p class="text-xs md:text-sm text-slate-300 mt-1">Mundos en verde indican que ya fueron completados (puedes repetirlos para sumar más XP).</p>
                            </div>
                            <div class="mt-4 md:mt-0 bg-slate-900/80 px-4 py-3 rounded-2xl border border-slate-700 text-center">
                                <span class="text-xs text-slate-400 block">Progreso Global</span>
                                <span class="font-display font-bold text-amber-400 text-lg">${this.currentProfile.xp || 0} XP</span>

                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">${worldsHTML}</div>
                    </div>
                `;
            }

            showWorldMissions(worldId) {
                this.sound.playClick();
                this.activeWorld = WORLDS_DATABASE.find(w => w.id === worldId);
                this.sound.startBGM(worldId, 1);
                const container = document.getElementById('view-container');

                let missionsHTML = this.activeWorld.missions.map(m => {
                    const completed = this.isMissionCompleted(this.activeWorld.id, m.id);
                    const itemBorder = completed ? 'border-emerald-500/70 bg-slate-800/95' : 'border-slate-700 hover:border-amber-500/50 bg-slate-800';
                    const numBadgeBg = completed ? 'bg-emerald-500/20 text-emerald-400' : 'bg-slate-900 text-amber-400';
                    const statusText = completed ? `<span class="text-[10px] text-emerald-400 font-semibold block">¡Completado ✓!</span>` : '';

                    return `
                        <div onclick="app.startMission(${m.id})" class="${itemBorder} border p-5 rounded-2xl cursor-pointer transition flex items-center justify-between group shadow-md">
                            <div class="flex items-center space-x-4">
                                <div class="w-12 h-12 ${numBadgeBg} rounded-xl flex items-center justify-center font-display font-bold text-lg group-hover:scale-105 transition">${m.id}</div>
                                <div>
                                    <h4 class="font-display font-bold text-white text-base">${m.title}</h4>
                                    <p class="text-xs text-slate-400">10 Vocabularios • 10 Frases Contextuales</p>
                                    ${statusText}
                                </div>
                            </div>
                            <div class="bg-amber-500/10 group-hover:bg-amber-500 text-amber-400 group-hover:text-slate-950 p-2.5 rounded-xl transition">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </div>
                        </div>
                    `;
                }).join('');

                container.innerHTML = `
                    <div class="flex-1 max-w-4xl mx-auto w-full p-4 md:p-8">
                        <button onclick="app.showWorldMap()" class="inline-flex items-center space-x-2 text-xs text-slate-400 hover:text-white mb-6 bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 transition"><span>← Volver a los Mundos</span></button>
                        <div class="mb-6 flex items-center space-x-4">
                            <span class="text-4xl p-3 bg-slate-800 rounded-2xl">${this.activeWorld.icon}</span>
                            <div>
                                <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">Mundo ${this.activeWorld.id}</span>
                                <h2 class="font-display font-extrabold text-2xl md:text-3xl text-white">${this.activeWorld.title}</h2>
                            </div>
                        </div>
                        <div class="space-y-3">${missionsHTML}</div>
                    </div>
                `;
            }

            startMission(missionId) {
                this.sound.playClick();
                this.activeMission = this.activeWorld.missions.find(m => m.id === missionId);
                this.sound.startBGM(this.activeWorld.id, missionId);
                this.showMissionDashboard();
            }

            showMissionDashboard() {
                this.stopTimer();
                this.sound.startBGM(this.activeWorld.id, this.activeMission.id);
                const container = document.getElementById('view-container');
                container.innerHTML = `
                    <div class="flex-1 max-w-4xl mx-auto w-full p-4 md:p-8 flex flex-col justify-center">
                        <button onclick="app.showWorldMissions(${this.activeWorld.id})" class="inline-flex items-center space-x-2 text-xs text-slate-400 hover:text-white mb-6 bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 transition self-start"><span>← Volver a Misiones</span></button>
                        <div class="bg-slate-800 border border-slate-700 p-6 md:p-8 rounded-3xl shadow-xl mb-6 text-center">
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider">Misión Activa</span>
                            <h2 class="font-display font-extrabold text-2xl md:text-4xl text-white mt-1 mb-2">${this.activeMission.title}</h2>
                            <p class="text-xs md:text-sm text-slate-400 max-w-lg mx-auto">Selecciona uno de los 4 minijuegos interactivos.</p>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <div onclick="app.launchGame1()" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-amber-500/50 p-6 rounded-2xl cursor-pointer transition shadow-lg flex items-center space-x-4 group">
                                <div class="w-14 h-14 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center text-2xl group-hover:scale-110 transition">🎴</div>
                                <div><h3 class="font-display font-bold text-white text-lg">Juego 1: Tarjetas 3D</h3><p class="text-xs text-slate-400">Carrusel de 10 tarjetas con voz nativa.</p></div>
                            </div>
                            <div onclick="app.launchGame2()" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-amber-500/50 p-6 rounded-2xl cursor-pointer transition shadow-lg flex items-center space-x-4 group">
                                <div class="w-14 h-14 bg-emerald-500/10 text-emerald-400 rounded-2xl flex items-center justify-center text-2xl group-hover:scale-110 transition">🧩</div>
                                <div><h3 class="font-display font-bold text-white text-lg">Juego 2: Tríos Iguales</h3><p class="text-xs text-slate-400">2 rondas de 5 tríos (15 cartas).</p></div>
                            </div>
                            <div onclick="app.launchGame3()" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-amber-500/50 p-6 rounded-2xl cursor-pointer transition shadow-lg flex items-center space-x-4 group">
                                <div class="w-14 h-14 bg-indigo-500/10 text-indigo-400 rounded-2xl flex items-center justify-center text-2xl group-hover:scale-110 transition">✍️</div>
                                <div><h3 class="font-display font-bold text-white text-lg">Juego 3: Completar Frases</h3><p class="text-xs text-slate-400">Secuencia exacta de 10 frases con opciones aleatorias.</p></div>
                            </div>
                            <div onclick="app.launchGame4()" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 hover:border-amber-500/50 p-6 rounded-2xl cursor-pointer transition shadow-lg flex items-center space-x-4 group">
                                <div class="w-14 h-14 bg-rose-500/10 text-rose-400 rounded-2xl flex items-center justify-center text-2xl group-hover:scale-110 transition">🔗</div>
                                <div><h3 class="font-display font-bold text-white text-lg">Juego 4: Unir Parejas</h3><p class="text-xs text-slate-400">2 rondas de 5 parejas (Icono vs Palabra).</p></div>
                            </div>
                        </div>
                    </div>
                `;
            }

            startTimer(durationSeconds, onTimeout) {
                this.stopTimer();
                this.timeRemaining = durationSeconds;
                const container = document.getElementById('view-container');
                
                let timerBar = document.getElementById('game-timer-container');
                if (!timerBar) {
                    const topBar = document.createElement('div');
                    topBar.id = 'game-timer-container';
                    topBar.className = 'bg-slate-800 border-b border-slate-700 px-4 py-2 flex items-center justify-between text-xs sticky top-14 z-40';
                    topBar.innerHTML = `
                        <span class="text-slate-400 font-semibold">Tiempo Restante:</span>
                        <div class="flex-1 mx-4 bg-slate-900 rounded-full h-3 overflow-hidden border border-slate-700">
                            <div id="game-timer-fill" class="bg-amber-500 h-full w-full transition-all duration-1000"></div>
                        </div>
                        <span id="game-timer-text" class="font-bold text-amber-400">2:00</span>
                    `;
                    container.prepend(topBar);
                }

                this.sound.startHeartbeat(1000);
                this.timerInterval = setInterval(() => {
                    this.timeRemaining--;
                    const mins = Math.floor(this.timeRemaining / 60);
                    const secs = this.timeRemaining % 60;
                    const textEl = document.getElementById('game-timer-text');
                    const fillEl = document.getElementById('game-timer-fill');
                    
                    if (textEl) textEl.innerText = `${mins}:${secs < 10 ? '0' : ''}${secs}`;
                    if (fillEl) {
                        const pct = (this.timeRemaining / durationSeconds) * 100;
                        fillEl.style.width = `${pct}%`;
                        if (this.timeRemaining <= 30) {
                            fillEl.classList.remove('bg-amber-500');
                            fillEl.classList.add('bg-rose-500', 'animate-pulse');
                            if (this.timeRemaining % 2 === 0) this.sound.startHeartbeat(500);
                        }
                    }

                    if (this.timeRemaining <= 0) {
                        this.stopTimer();
                        if (onTimeout) onTimeout();
                    }
                }, 1000);
            }

            stopTimer() {
                if (this.timerInterval) { clearInterval(this.timerInterval); this.timerInterval = null; }
                this.sound.stopHeartbeat();
                const timerContainer = document.getElementById('game-timer-container');
                if (timerContainer) timerContainer.remove();
            }

            speakWord(text) {
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = 'es-MX'; utterance.rate = 0.9;
                    window.speechSynthesis.speak(utterance);
                }
            }

            awardXP(amount) {
                this.currentProfile.xp = (this.currentProfile.xp || 0) + amount;
                this.saveProfiles();
                const headerXp = document.getElementById('header-xp');
                if (headerXp) headerXp.innerText = `${this.currentProfile.xp} XP`;
                this.sound.playSuccess();
                this.markMissionCompleted(this.activeWorld.id, this.activeMission.id);
            }

            // JUEGO 1: Tarjetas 3D
            launchGame1() {
                this.sound.playClick();
                this.game1Index = 0;
                this.renderGame1Card();
            }

            renderGame1Card() {
                const vocab = this.activeMission.vocab;
                const item = vocab[this.game1Index];
                const container = document.getElementById('view-container');
                
                container.innerHTML = `
                    <div class="flex-1 max-w-xl mx-auto w-full p-4 md:p-8 flex flex-col justify-between">
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="app.showMissionDashboard()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 transition">← Volver</button>
                            <span class="text-xs font-bold text-amber-400">Tarjeta ${this.game1Index + 1} de 10</span>
                        </div>
                        
                        <div class="perspective-1000 w-full aspect-[4/3] my-auto cursor-pointer" onclick="this.querySelector('.card-inner').classList.toggle('rotate-y-180')">
                            <div class="card-inner relative w-full h-full text-center transition-transform duration-500 transform-style-3d shadow-2xl rounded-3xl">
                                <div class="absolute inset-0 bg-slate-800 border border-slate-700 rounded-3xl p-6 flex flex-col items-center justify-center backface-hidden">
                                    <div class="w-24 h-24 mb-3 rounded-2xl overflow-hidden bg-slate-900 flex items-center justify-center shadow-inner">
                                        <img src="${item.image}" alt="${item.es}" class="w-full h-full object-cover" onerror="this.outerHTML='<div class=\\'missing-image-fallback w-full h-full\\'>FALTA IMAGEN</div>'">
                                    </div>
                                    <h2 class="font-display font-extrabold text-3xl md:text-4xl text-white mb-1 tracking-tight">${item.es}</h2>
                                    <p class="text-slate-400 text-xs md:text-sm font-semibold tracking-wide">${item.en}</p>
                                    <span class="mt-4 text-[10px] text-amber-400 bg-amber-500/10 px-3 py-1 rounded-full border border-amber-500/20 uppercase tracking-widest font-bold">Toca para voltear</span>
                                </div>
                                <div class="absolute inset-0 bg-gradient-to-tr from-amber-600 to-orange-600 border border-amber-500 rounded-3xl p-6 flex flex-col items-center justify-center backface-hidden rotate-y-180 text-white">
                                    <span class="text-5xl mb-3">🔊</span>
                                    <h3 class="font-display font-bold text-2xl mb-2">Pronunciación Latinoamericana</h3>
                                    <button onclick="event.stopPropagation(); app.speakWord('${item.es}')" class="bg-slate-900 hover:bg-slate-800 text-amber-400 font-bold px-6 py-3 rounded-2xl shadow-lg transition flex items-center space-x-2 text-sm">
                                        <span>Escuchar "${item.es}"</span>
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="flex space-x-3 mt-6">
                            <button onclick="app.game1Prev()" ${this.game1Index === 0 ? 'disabled' : ''} class="flex-1 bg-slate-800 hover:bg-slate-700 disabled:opacity-50 text-white font-bold py-3.5 rounded-2xl transition text-sm">Anterior</button>
                            <button onclick="app.game1Next()" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3.5 rounded-2xl transition text-sm">
                                ${this.game1Index === 9 ? 'Finalizar' : 'Siguiente'}
                            </button>
                        </div>
                    </div>
                `;
            }

            game1Next() {
                this.sound.playClick();
                if (this.game1Index < 9) { this.game1Index++; this.renderGame1Card(); }
                else { this.awardXP(50); this.showMsg("¡Tarjetas 3D completadas! +50 XP", "🎉"); this.showMissionDashboard(); }
            }
            game1Prev() {
                this.sound.playClick();
                if (this.game1Index > 0) { this.game1Index--; this.renderGame1Card(); }
            }

            // JUEGO 2: Tríos Iguales
            launchGame2() {
                this.sound.playClick();
                this.game2Round = 1;
                this.loadGame2Round();
            }

            loadGame2Round() {
                const sliceStart = (this.game2Round - 1) * 5;
                const roundVocab = this.activeMission.vocab.slice(sliceStart, sliceStart + 5);
                
                this.game2Cards = [];
                roundVocab.forEach((v, idx) => {
                    this.game2Cards.push({ id: idx, type: 'es', text: v.es });
                    this.game2Cards.push({ id: idx, type: 'en', text: v.en });
                    this.game2Cards.push({ id: idx, type: 'emoji', text: v.emoji });
                });
                this.game2Cards.sort(() => Math.random() - 0.5);
                this.game2SelectedCards = [];
                this.game2MatchedCount = 0;
                this.renderGame2Grid();
            }

            renderGame2Grid() {
                const container = document.getElementById('view-container');
                let gridHTML = this.game2Cards.map((c, i) => `
                    <div onclick="app.game2SelectCard(${i})" id="card-${i}" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 h-24 rounded-2xl p-2 flex flex-col items-center justify-center cursor-pointer transition shadow-md select-none text-center">
                        <span class="font-display font-bold text-sm md:text-base text-white">${c.text}</span>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="flex-1 max-w-3xl mx-auto w-full p-4 md:p-8 flex flex-col justify-between">
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="app.showMissionDashboard()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 transition">← Volver</button>
                            <span class="text-xs font-bold text-amber-400">Tríos Iguales • Ronda ${this.game2Round} de 2</span>
                        </div>
                        <div class="text-center mb-4">
                            <h2 class="font-display font-bold text-xl text-white">Empareja el Trío Correcto</h2>
                            <p class="text-xs text-slate-400">Selecciona la palabra en español, inglés y su respectivo icono.</p>
                        </div>
                        <div class="grid grid-cols-3 md:grid-cols-5 gap-3 my-auto">${gridHTML}</div>
                    </div>
                `;
            }

            game2SelectCard(idx) {
                const cardObj = this.game2Cards[idx];
                const cardEl = document.getElementById(`card-${idx}`);
                if (!cardEl || cardEl.classList.contains('bg-emerald-600') || cardEl.classList.contains('opacity-40')) return;

                this.sound.playClick();
                cardEl.classList.add('bg-amber-600', 'border-amber-400', 'scale-95');
                this.game2SelectedCards.push({ idx, ...cardObj });

                if (this.game2SelectedCards.length === 3) {
                    const [c1, c2, c3] = this.game2SelectedCards;
                    const uniqueTypes = new Set([c1.type, c2.type, c3.type]);
                    const sameId = (c1.id === c2.id && c2.id === c3.id);

                    if (sameId && uniqueTypes.size === 3) {
                        this.sound.playSuccess();
                        this.game2SelectedCards.forEach(sc => {
                            const el = document.getElementById(`card-${sc.idx}`);
                            if (el) el.className = 'bg-emerald-600 border-emerald-500 h-24 rounded-2xl p-2 flex flex-col items-center justify-center cursor-default shadow-md opacity-80';
                        });
                        this.game2MatchedCount++;
                        this.game2SelectedCards = [];

                        if (this.game2MatchedCount === 5) {
                            setTimeout(() => {
                                if (this.game2Round === 1) { this.game2Round = 2; this.loadGame2Round(); }
                                else { this.awardXP(75); this.showMsg("¡Tríos Iguales completados! +75 XP", "🏆"); this.showMissionDashboard(); }
                            }, 1000);
                        }
                    } else {
                        this.sound.playError();
                        this.game2SelectedCards.forEach(sc => {
                            const el = document.getElementById(`card-${sc.idx}`);
                            if (el) el.className = 'bg-rose-900/80 border-rose-600 h-24 rounded-2xl p-2 flex flex-col items-center justify-center cursor-pointer transition shadow-md';
                        });
                        setTimeout(() => {
                            this.game2SelectedCards.forEach(sc => {
                                const el = document.getElementById(`card-${sc.idx}`);
                                if (el) el.className = 'bg-slate-800 hover:bg-slate-750 border border-slate-700 h-24 rounded-2xl p-2 flex flex-col items-center justify-center cursor-pointer transition shadow-md';
                            });
                            this.game2SelectedCards = [];
                        }, 800);
                    }
                }
            }

            // JUEGO 3: Completar Frases (Opciones mezcladas aleatoriamente)
            launchGame3() {
                this.sound.playClick();
                this.game3SentenceIdx = 0;
                this.game3Sentences = this.activeMission.sentences;

                this.startTimer(120, () => {
                    this.showMsg("¡Se ha acabado el tiempo!", "⏰");
                    this.showMissionDashboard();
                });

                this.renderGame3Sentence();
            }

            renderGame3Sentence() {
                const item = this.game3Sentences[this.game3SentenceIdx];
                const container = document.getElementById('view-container');

                const options = [item.answer, ...(item.distractors || ["Opción A", "Opción B"])];
                options.sort(() => Math.random() - 0.5);

                let optionsHTML = options.map(opt => `
                    <button onclick="app.game3Check('${opt.replace(/'/g, "\\'")}', '${item.answer.replace(/'/g, "\\'")}')" class="bg-slate-800 hover:bg-slate-700 border border-slate-700 hover:border-amber-500 p-4 rounded-2xl text-white font-bold transition shadow-md text-base">
                        ${opt}
                    </button>
                `).join('');

                container.innerHTML = `
                    <div class="flex-1 max-w-xl mx-auto w-full p-4 md:p-8 flex flex-col justify-between">
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="app.showMissionDashboard(); app.stopTimer();" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 transition">← Volver</button>
                            <span class="text-xs font-bold text-amber-400">Frase ${this.game3SentenceIdx + 1} de 10</span>
                        </div>
                        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-xl text-center my-auto">
                            <span class="text-xs font-bold text-amber-400 uppercase tracking-wider mb-2 block">Completa el espacio en blanco</span>
                            <h3 class="font-display font-bold text-xl md:text-2xl text-white mb-6">${item.sentence}</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">${optionsHTML}</div>
                        </div>
                    </div>
                `;
            }

            game3Check(selected, correct) {
                if (selected.trim().toLowerCase() === correct.trim().toLowerCase()) {
                    this.sound.playSuccess();
                    this.showMsg("¡Correcto!", "✨");
                    this.game3SentenceIdx++;
                    if (this.game3SentenceIdx < 10) { this.renderGame3Sentence(); }
                    else {
                        this.stopTimer();
                        this.awardXP(100);
                        this.showMsg("¡Completar Frases finalizado! +100 XP", "🎓");
                        this.showMissionDashboard();
                    }
                } else {
                    this.sound.playError();
                    this.showMsg("Incorrecto, intenta de nuevo.", "❌");
                }
            }

            // JUEGO 4: Unir Parejas
            launchGame4() {
                this.sound.playClick();
                this.game4Round = 1;
                this.loadGame4Round();
            }

            loadGame4Round() {
                const sliceStart = (this.game4Round - 1) * 5;
                const roundVocab = this.activeMission.vocab.slice(sliceStart, sliceStart + 5);
                
                this.game4LeftItems = roundVocab.map((v, i) => ({ id: i, text: v.es, image: v.image }));
                this.game4RightItems = roundVocab.map((v, i) => ({ id: i, text: v.en }));
                
                this.game4LeftItems.sort(() => Math.random() - 0.5);
                this.game4RightItems.sort(() => Math.random() - 0.5);

                this.game4SelectedLeft = null;
                this.game4MatchedPairs = 0;
                this.renderGame4Match();
            }

            renderGame4Match() {
                const container = document.getElementById('view-container');
                let leftHTML = this.game4LeftItems.map(l => `
                    <div onclick="app.game4SelectLeft(${l.id})" id="left-${l.id}" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 p-3 rounded-2xl cursor-pointer transition shadow-md flex items-center space-x-3">
                        <div class="w-12 h-12 rounded-xl overflow-hidden bg-slate-900 flex items-center justify-center flex-shrink-0">
                            <img src="${l.image}" alt="${l.text}" class="w-full h-full object-cover" onerror="this.outerHTML='<div class=\\'missing-image-fallback w-full h-full text-[8px]\\'>FALTA IMAGEN</div>'">
                        </div>
                        <span class="font-display font-bold text-white text-base">${l.text}</span>
                    </div>
                `).join('');

                let rightHTML = this.game4RightItems.map(r => `
                    <div onclick="app.game4SelectRight(${r.id})" id="right-${r.id}" class="bg-slate-800 hover:bg-slate-750 border border-slate-700 p-4 rounded-2xl cursor-pointer transition shadow-md flex items-center justify-center text-center">
                        <span class="font-display font-bold text-white text-base">${r.text}</span>
                    </div>
                `).join('');

                container.innerHTML = `
                    <div class="flex-1 max-w-3xl mx-auto w-full p-4 md:p-8 flex flex-col justify-between">
                        <div class="flex items-center justify-between mb-4">
                            <button onclick="app.showMissionDashboard()" class="text-xs text-slate-400 hover:text-white bg-slate-800 px-3 py-2 rounded-xl border border-slate-700 transition">← Volver</button>
                            <span class="text-xs font-bold text-amber-400">Unir Parejas • Ronda ${this.game4Round} de 2</span>
                        </div>
                        <div class="text-center mb-4">
                            <h2 class="font-display font-bold text-xl text-white">Une Español con Inglés</h2>
                            <p class="text-xs text-slate-400">Selecciona un elemento de la izquierda y su traducción en la derecha.</p>
                        </div>
                        <div class="grid grid-cols-2 gap-6 my-auto">
                            <div class="space-y-3">${leftHTML}</div>
                            <div class="space-y-3">${rightHTML}</div>
                        </div>
                    </div>
                `;
            }

            game4SelectLeft(id) {
                this.sound.playClick();
                this.game4LeftItems.forEach(l => {
                    const el = document.getElementById(`left-${l.id}`);
                    if (el && !el.classList.contains('opacity-40')) {
                        el.className = "bg-slate-800 hover:bg-slate-750 border border-slate-700 p-3 rounded-2xl cursor-pointer transition shadow-md flex items-center space-x-3";
                    }
                });
                this.game4SelectedLeft = id;
                const el = document.getElementById(`left-${id}`);
                if (el) el.className = "bg-amber-600 border-amber-400 p-3 rounded-2xl cursor-pointer transition shadow-md flex items-center space-x-3";
            }

            game4SelectRight(id) {
                if (this.game4SelectedLeft === null) { this.showMsg("Primero selecciona un elemento de la izquierda.", "⚠️"); return; }

                if (this.game4SelectedLeft === id) {
                    this.sound.playSuccess();
                    const leftEl = document.getElementById(`left-${id}`);
                    const rightEl = document.getElementById(`right-${id}`);
                    
                    if (leftEl) leftEl.className = "bg-emerald-600 border-emerald-500 p-3 rounded-2xl cursor-default transition shadow-md opacity-40 flex items-center space-x-3";
                    if (rightEl) rightEl.className = "bg-emerald-600 border-emerald-500 p-4 rounded-2xl cursor-default transition shadow-md opacity-40 flex items-center justify-center text-center";
                    
                    this.game4SelectedLeft = null;
                    this.game4MatchedPairs++;

                    if (this.game4MatchedPairs === 5) {
                        setTimeout(() => {
                            if (this.game4Round === 1) { this.game4Round = 2; this.loadGame4Round(); }
                            else { this.awardXP(75); this.showMsg("¡Unir Parejas completado! +75 XP", "🌟"); this.showMissionDashboard(); }
                        }, 800);
                    }
                } else {
                    this.sound.playError();
                    this.showMsg("No coinciden, intenta de nuevo.", "❌");
                    this.game4SelectedLeft = null;
                    this.game4LeftItems.forEach(l => {
                        const el = document.getElementById(`left-${l.id}`);
                        if (el && !el.classList.contains('opacity-40')) {
                            el.className = "bg-slate-800 hover:bg-slate-750 border border-slate-700 p-3 rounded-2xl cursor-pointer transition shadow-md flex items-center space-x-3";
                        }
                    });
                }
            }

            openLiveRoomModal() {
                this.sound.playClick();
                const modal = document.getElementById('live-room-modal');
                if (modal) modal.classList.remove('hidden');
            }

            closeLiveRoomModal() {
                this.sound.playClick();
                const modal = document.getElementById('live-room-modal');
                if (modal) modal.classList.add('hidden');
            }

            startLiveGameSimulation() {
                this.sound.playClick();
                this.closeLiveRoomModal();
                const container = document.getElementById('view-container');
                container.innerHTML = `
                    <div class="flex-1 max-w-xl mx-auto w-full p-4 md:p-8 flex flex-col justify-center text-center">
                        <div class="bg-slate-800 border border-slate-700 p-8 rounded-3xl shadow-2xl">
                            <span class="bg-indigo-500/20 text-indigo-400 text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full border border-indigo-500/30">Sala en Vivo Activa</span>
                            <h2 class="font-display font-extrabold text-2xl md:text-3xl text-white mt-4 mb-2">¡Pregunta en Directo #1!</h2>
                            <p class="text-lg text-amber-400 font-bold mb-6">¿Cómo se le dice al padre en Latinoamérica de forma cariñosa?</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6">
                                <button onclick="app.liveAnswer(true)" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold p-4 rounded-2xl transition shadow-lg text-base">Papá</button>
                                <button onclick="app.liveAnswer(false)" class="bg-rose-600 hover:bg-rose-500 text-white font-bold p-4 rounded-2xl transition shadow-lg text-base">Tutor</button>
                            </div>
                        </div>
                    </div>
                `;
            }

            liveAnswer(isCorrect) {
                if (isCorrect) { this.sound.playSuccess(); this.awardXP(50); this.showMsg("¡Respuesta correcta en vivo! +50 XP", "🎉"); }
                else { this.sound.playError(); this.showMsg("Respuesta incorrecta.", "❌"); }
                setTimeout(() => this.showWorldMap(), 1500);
            }
        }

        let app;
        window.onload = function() { app = new AppManager(); app.init(); };
    </script>
</body>
</html>
