<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura en Español - Aprende Jugando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0b1120 100%);
      --card-bg: rgba(30, 41, 59, 0.7);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: #38bdf8;
      --orange: #f97316;
      --orange-glow: rgba(249, 115, 22, 0.35);
      --green: #10b981;
      --green-glow: rgba(16, 185, 129, 0.35);
      --blue: #0ea5e9;
      --yellow: #fbbf24;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: var(--bg-gradient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* HEADER HUD */
    header {
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }

    .brand-icon {
      font-size: 1.8rem;
      animation: floatIcon 3s ease-in-out infinite;
    }

    .brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.45rem;
      font-weight: 800;
      background: linear-gradient(135deg, #fb923c, #f97316);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.5px;
    }

    .hud-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .timer-badge {
      background: rgba(14, 165, 233, 0.1);
      border: 1.5px solid rgba(56, 189, 248, 0.4);
      padding: 6px 14px;
      border-radius: 999px;
      font-family: 'Space Grotesk', monospace;
      font-weight: 700;
      font-size: 1.05rem;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.15);
    }

    .stats-badge {
      display: flex;
      gap: 16px;
      align-items: center;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 6px 16px;
      border-radius: 999px;
    }

    .stat-node {
      display: flex;
      align-items: center;
      gap: 6px;
      font-weight: 800;
      font-size: 0.95rem;
    }

    main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: 28px 20px;
    }

    /* VISTAS */
    .view { display: none; }
    .view.active { display: block; animation: fadeIn 0.35s ease; }

    .hero-banner {
      text-align: center;
      margin-bottom: 32px;
    }

    .hero-banner h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.6rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }

    .hero-banner p {
      color: var(--text-muted);
      font-size: 1.15rem;
    }

    /* GRID LECCIONES */
    .lessons-matrix {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
    }

    .mission-card {
      background: var(--card-bg);
      backdrop-filter: blur(8px);
      border: 1.5px solid var(--card-border);
      border-radius: 20px;
      padding: 22px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .mission-card:hover {
      transform: translateY(-6px);
      border-color: var(--card-border-hover);
      box-shadow: 0 16px 32px rgba(14, 165, 233, 0.18);
      background: rgba(30, 41, 59, 0.9);
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .mission-badge {
      font-size: 0.75rem;
      font-weight: 800;
      color: var(--blue);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .mission-icon {
      font-size: 3rem;
      margin: 6px 0;
    }

    .mission-title {
      font-size: 1.25rem;
      font-weight: 800;
    }

    .mission-footer {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--green);
    }

    /* PANTALLA JUEGOS */
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: #38bdf8;
      padding: 8px 16px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 20px;
      transition: all 0.2s;
    }

    .back-btn:hover {
      background: rgba(14, 165, 233, 0.15);
      border-color: var(--blue);
    }

    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .lesson-title-text {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2rem;
      font-weight: 800;
    }

    .game-switcher {
      display: flex;
      gap: 10px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .switch-btn {
      background: var(--card-bg);
      border: 1.5px solid var(--card-border);
      color: var(--text-muted);
      padding: 10px 18px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .switch-btn:hover {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .switch-btn.active {
      background: var(--orange);
      border-color: var(--orange);
      color: #fff;
      box-shadow: 0 0 15px var(--orange-glow);
    }

    .arena-container {
      background: rgba(30, 41, 59, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1.5px solid var(--card-border);
      border-radius: 24px;
      padding: 36px 24px;
      min-height: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* JUEGO 1: FLASHCARDS 3D */
    .fc-stage {
      perspective: 1000px;
      width: 320px;
      height: 380px;
      cursor: pointer;
    }

    .fc-flipper {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
      border-radius: 24px;
    }

    .fc-stage.flipped .fc-flipper {
      transform: rotateY(180deg);
    }

    .fc-side {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 24px;
      border: 2px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .fc-front {
      background: linear-gradient(145deg, #1e293b, #0f172a);
    }

    .fc-back {
      background: linear-gradient(145deg, #0f172a, #1e293b);
      transform: rotateY(180deg);
      border-color: var(--orange);
    }

    .fc-icon {
      font-size: 6.5rem;
      margin-bottom: 16px;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.3));
    }

    .fc-word-es {
      font-size: 2.2rem;
      font-weight: 800;
      color: #fff;
    }

    .fc-word-en {
      font-size: 1.8rem;
      font-weight: 700;
      color: #38bdf8;
      margin: 12px 0 20px;
    }

    .fc-controls {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-top: 24px;
    }

    .icon-action-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #fff;
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s;
    }

    .icon-action-btn:hover {
      background: var(--blue);
      border-color: var(--blue);
    }

    /* JUEGO 2: TRÍOS IGUALES (21 CARTAS) */
    .trio-board-wrap {
      width: 100%;
      max-width: 820px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .trio-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 16px;
    }

    .trio-card {
      aspect-ratio: 1;
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .trio-card:hover:not(.revealed):not(.matched) {
      transform: translateY(-3px);
      border-color: var(--blue);
    }

    .trio-card.revealed {
      background: #334155;
      border-color: #38bdf8;
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
      transform: scale(1.04);
    }

    .trio-card.matched {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--green);
      cursor: default;
      opacity: 0.6;
    }

    /* JUEGO 3: COMPLETAR 4 FRASES EN CADENA */
    .fill-sentence-box {
      width: 100%;
      max-width: 760px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .step-counter {
      font-size: 0.9rem;
      font-weight: 800;
      color: var(--orange);
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 12px;
    }

    .sentence-lead-icon {
      font-size: 5.5rem;
      margin-bottom: 16px;
      filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.35));
    }

    .sentence-stream {
      font-size: 2.1rem;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 32px;
      min-height: 75px;
    }

    .pill-slot {
      display: inline-block;
      min-width: 140px;
      padding: 4px 16px;
      border-bottom: 3px dashed var(--orange);
      color: var(--orange);
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .pill-slot.filled {
      border-bottom: 3px solid var(--green);
      background: rgba(16, 185, 129, 0.25);
      color: #34d399;
      border-radius: 10px;
      transform: scale(1.08);
    }

    .answer-chips {
      display: flex;
      gap: 16px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .chip-btn {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.12);
      color: #fff;
      padding: 14px 28px;
      border-radius: 16px;
      font-size: 1.25rem;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .chip-btn:hover {
      border-color: var(--blue);
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(14, 165, 233, 0.25);
    }

    /* JUEGO 4: UNIR 8 PAREJAS EN 2 RONDAS */
    .match-arena {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .match-hud-bar {
      display: flex;
      justify-content: space-between;
      width: 100%;
      align-items: center;
      margin-bottom: 24px;
    }

    .match-columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 28px;
      width: 100%;
    }

    .match-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .match-cell {
      background: rgba(15, 23, 42, 0.9);
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      height: 74px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 0 16px;
    }

    .match-cell.icon-cell { font-size: 2.5rem; }
    .match-cell.word-cell { font-size: 1.25rem; font-weight: 800; }

    .match-cell:hover:not(.correct) {
      border-color: var(--blue);
      transform: translateY(-2px);
    }

    .match-cell.selected {
      border-color: var(--orange);
      background: rgba(249, 115, 22, 0.25);
      box-shadow: 0 0 20px var(--orange-glow);
      transform: scale(1.02);
    }

    .match-cell.correct {
      border-color: var(--green);
      background: rgba(16, 185, 129, 0.25);
      color: #34d399;
      pointer-events: none;
      opacity: 0.85;
    }

    /* PANTALLA VICTORIA */
    .victory-box {
      text-align: center;
      animation: popIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .trophy-bounce {
      font-size: 6.5rem;
      margin-bottom: 16px;
      animation: bounce 1.2s infinite alternate ease-in-out;
    }

    .victory-title {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 2.5rem;
      font-weight: 800;
      margin-bottom: 12px;
    }

    .time-stat {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--yellow);
      margin-bottom: 8px;
    }

    /* TOAST DINÁMICO */
    #toastMessage {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      background: linear-gradient(135deg, #10b981, #059669);
      color: #fff;
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 1.15rem;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.6);
      display: none;
      z-index: 1000;
      white-space: nowrap;
    }

    #toastMessage.error {
      background: linear-gradient(135deg, #f97316, #ea580c);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.9); }
      to { opacity: 1; transform: scale(1); }
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-12px); }
    }

    @keyframes floatIcon {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-4px) rotate(4deg); }
    }

    @media (max-width: 768px) {
      .trio-grid { grid-template-columns: repeat(4, 1fr); }
      .sentence-stream { font-size: 1.6rem; }
      .match-columns { gap: 14px; }
      .match-cell.word-cell { font-size: 1.05rem; }
    }
  </style>
</head>
<body>

  <header>
    <div class="brand" onclick="goToPortal()">
      <div class="brand-icon">🏆</div>
      <div class="brand-name">Aventura en Español</div>
    </div>

    <div class="hud-right">
      <div class="timer-badge">
        ⏱️ <span id="clockValue">00:00</span>
      </div>
      <div class="stats-badge">
        <div class="stat-node">⭐ <span id="starCounter">0</span></div>
        <div class="stat-node">🔥 <span id="pointCounter">0</span> Pts</div>
      </div>
    </div>
  </header>

  <main>
    <!-- VISTA 1: PORTAL DE LAS 23 LECCIONES -->
    <section id="viewPortal" class="view active">
      <div class="hero-banner">
        <h1>¡Elige tu Misión de Hoy!</h1>
        <p>Aprende palabras, supera retos y conviértete en un Titán del Español</p>
      </div>
      <div class="lessons-matrix" id="lessonsGrid"></div>
    </section>

    <!-- VISTA 2: PANTALLA DE JUEGOS DE LA LECCIÓN -->
    <section id="viewLesson" class="view">
      <button class="back-btn" onclick="goToPortal()">
        ◀ Volver a todas las misiones
      </button>

      <div class="lesson-header">
        <div class="lesson-title-text" id="lessonHeading">Lección</div>
      </div>

      <div class="game-switcher">
        <button class="switch-btn active" onclick="loadGame(1)">🎴 1. Tarjetas 3D</button>
        <button class="switch-btn" onclick="loadGame(2)">🧩 2. Tríos Iguales (21)</button>
        <button class="switch-btn" onclick="loadGame(3)">✍️ 3. Completa 4 Frases</button>
        <button class="switch-btn" onclick="loadGame(4)">🔗 4. Unir Parejas (8)</button>
      </div>

      <div class="arena-container" id="gameArena"></div>
    </section>
  </main>

  <div id="toastMessage"></div>

  <script>

          { icon: "🧾", before: "Pagamos todas las compras en la ", after: ".", answer: "caja", opts: ["caja", "cama", "mochila"] }
        ]
      },
      21: {

        icon: "👕",
        items: [

          { es: "El Pantalón", en: "Pants", icon: "👖" },

          { es: "La Talla", en: "Size", icon: "🏷️" },

        ],
        sentences: [
          { icon: "👟", before: "Para correr y jugar me pongo mis ", after: ".", answer: "zapatos", opts: ["zapatos", "sartenes", "relojes"] },
          { icon: "🧢", before: "Para protegerme del sol me pongo la ", after: ".", answer: "gorra", opts: ["gorra", "abrigo", "camisa"] },
          { icon: "🧥", before: "Cuando hace mucho frío me pongo un buen ", after: ".", answer: "abrigo", opts: ["abrigo", "pantalón", "espejo"] },
          { icon: "🪞", before: "Miro cómo me queda la ropa en el ", after: ".", answer: "espejo", opts: ["espejo", "calcetines", "talla"] }
        ]
      },
      22: {

        icon: "🍿",
        items: [
          { es: "Las Palomitas", en: "Popcorn", icon: "🍿" },
          { es: "La Película", en: "Movie", icon: "🎬" },
          { es: "La Pantalla", en: "Big Screen", icon: "📺" },
          { es: "La Entrada", en: "Ticket", icon: "🎟️" },
          { es: "El Refresco", en: "Soda", icon: "🥤" },
          { es: "Las Gafas 3D", en: "3D Glasses", icon: "👓" },
          { es: "La Butaca", en: "Seat", icon: "💺" },
          { es: "El Sonido", en: "Sound", icon: "🔊" }
        ],
        sentences: [
          { icon: "🍿", before: "Mientras veo la película como ricas ", after: ".", answer: "palomitas", opts: ["palomitas", "piedras", "hojas"] },
          { icon: "🎬", before: "Comienza la emocionante ", after: " en el cine.", answer: "película", opts: ["película", "entrada", "butaca"] },
          { icon: "👓", before: "Para ver los efectos uso mis ", after: " especiales.", answer: "gafas", opts: ["gafas", "palomitas", "pantalla"] },
          { icon: "🎟️", before: "Antes de entrar a la sala presento mi ", after: ".", answer: "entrada", opts: ["entrada", "refresco", "sonido"] }
        ]
      },
      23: {
        name: "Cocinar",
        icon: "👨‍🍳",
        items: [
          { es: "El Chef", en: "The Chef", icon: "👨‍🍳" },
          { es: "La Olla", en: "Cooking Pot", icon: "🍲" },
          { es: "La Receta", en: "Recipe", icon: "📜" },
          { es: "El Fuego", en: "Fire", icon: "🔥" },
          { es: "La Sal", en: "Salt", icon: "🧂" },
          { es: "El Pastel", en: "Cake", icon: "🎂" },
          { es: "El Delantal", en: "Apron", icon: "🦺" },
          { es: "La Cuchara", en: "Spoon", icon: "🥄" }
        ],
        sentences: [
          { icon: "🍲", before: "El cocinero prepara una rica sopa en la ", after: ".", answer: "olla", opts: ["olla", "cama", "pelota"] },
          { icon: "🎂", before: "Para el cumpleaños horneamos un delicioso ", after: ".", answer: "pastel", opts: ["pastel", "fuego", "receta"] },
          { icon: "🦺", before: "Para no ensuciarme la ropa me pongo el ", after: ".", answer: "delantal", opts: ["delantal", "sal", "chef"] },
          { icon: "📜", before: "Seguimos todos los pasos leyendo la ", after: ".", answer: "receta", opts: ["receta", "cuchara", "olla"] }
        ]
      }
    };

    // VARIABLES DE ESTADO
    let currentScore = 0;
    let currentStars = 0;
    let currentActiveLesson = 1;
    let currentActiveGame = 1;

    // CRONÓMETRO AMIGABLE
    let timerTotalSeconds = 0;
    let timerHandle = null;

    function resetTimer() {
      if (timerHandle) clearInterval(timerHandle);
      timerTotalSeconds = 0;
      refreshTimerHUD();
      timerHandle = setInterval(() => {
        timerTotalSeconds++;
        refreshTimerHUD();
      }, 1000);
    }

    function haltTimer() {
      if (timerHandle) clearInterval(timerHandle);
    }

    function refreshTimerHUD() {
      const m = Math.floor(timerTotalSeconds / 60).toString().padStart(2, '0');
      const s = (timerTotalSeconds % 60).toString().padStart(2, '0');
      document.getElementById('clockValue').innerText = `${m}:${s}`;
    }

    // AUDIO CON SÍNTESIS DE VOZ NATIVA
    function pronounceWord(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.lang = 'es-ES';
        utter.rate = 0.9;
        window.speechSynthesis.speak(utter);
      }
    }

    // FEEDBACK SONORO SINTETIZADO (WEB AUDIO API)
    function playAudioChime(type) {
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'success') {
          osc.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
          osc.frequency.exponentialRampToValueAtTime(783.99, audioCtx.currentTime + 0.15); // G5
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.35);
        } else if (type === 'fanfare') {
          osc.frequency.setValueAtTime(440, audioCtx.currentTime);
          osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
          osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
          osc.start();
          osc.stop(audioCtx.currentTime + 0.6);
        }
      } catch (e) {
        // En navegadores que restrinjan audio antes de interacción
      }
    }

    // TOAST POSITIVO
    function displayToast(msg, isError = false) {
      const toast = document.getElementById('toastMessage');
      toast.innerText = msg;
      toast.classList.toggle('error', isError);
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 2600);
    }

    // GESTIÓN DE PUNTUACIÓN
    function awardPoints(pts) {
      currentScore += pts;
      document.getElementById('pointCounter').innerText = currentScore;
      const newStars = Math.floor(currentScore / 100);
      if (newStars > currentStars) {
        currentStars = newStars;
        document.getElementById('starCounter').innerText = currentStars;
        playAudioChime('fanfare');
      }
    }

    // NAVEGACIÓN
    function startApp() {
      buildPortal();
      resetTimer();
    }

    function buildPortal() {
      const container = document.getElementById('lessonsGrid');
      container.innerHTML = Object.keys(COMPREHENSIVE_DATABASE).map(id => {
        const l = COMPREHENSIVE_DATABASE[id];
        return `
          <div class="mission-card" onclick="startLesson(${id})">
            <div class="card-top">
              <span class="mission-badge">Misión #${id}</span>
              <span style="font-size:1.3rem;">⚡</span>
            </div>
            <div class="mission-icon">${l.icon}</div>
            <div class="mission-title">${l.name}</div>
            <div class="mission-footer">
              <span>●</span> ¡Lista para jugar!
            </div>
          </div>
        `;
      }).join('');
    }

    function goToPortal() {
      document.getElementById('viewPortal').classList.add('active');
      document.getElementById('viewLesson').classList.remove('active');
      resetTimer();
    }

    function startLesson(id) {
      currentActiveLesson = id;
      const l = COMPREHENSIVE_DATABASE[id];
      document.getElementById('viewPortal').classList.remove('active');
      document.getElementById('viewLesson').classList.add('active');
      document.getElementById('lessonHeading').innerText = `Lección ${id}: ${l.name} ${l.icon}`;
      loadGame(1);
    }

    function loadGame(gameNum) {
      currentActiveGame = gameNum;
      resetTimer();

      document.querySelectorAll('.switch-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', idx === (gameNum - 1));
      });

      const arena = document.getElementById('gameArena');
      if (gameNum === 1) setupFlashcards(arena);
      if (gameNum === 2) setupTrioGame(arena);
      if (gameNum === 3) setupSentenceGame(arena);
      if (gameNum === 4) setupMatchingGame(arena);
    }

    // ==========================================
    // JUEGO 1: FLASHCARDS 3D CON AUDIO
    // ==========================================
    let cardPointer = 0;
    function setupFlashcards(arena) {
      cardPointer = 0;
      renderCardFace(arena);
    }

    function renderCardFace(arena) {
      const items = COMPREHENSIVE_DATABASE[currentActiveLesson].items;
      if (cardPointer >= items.length) cardPointer = 0;
      const item = items[cardPointer];

      arena.innerHTML = `
        <div class="fc-stage" onclick="this.classList.toggle('flipped')">
          <div class="fc-flipper">
            <div class="fc-side fc-front">
              <div class="fc-icon">${item.icon}</div>
              <div class="fc-word-es">${item.es}</div>
              <p style="color:var(--text-muted); margin-top:14px; font-size:0.95rem;">(Haz clic para voltear)</p>
            </div>
            <div class="fc-side fc-back">
              <span style="font-size:0.85rem; color:var(--orange); font-weight:800; text-transform:uppercase; letter-spacing:1px;">Significado en inglés</span>
              <div class="fc-word-en">${item.en}</div>
              <button onclick="event.stopPropagation(); pronounceWord('${item.es}')" class="icon-action-btn" style="background:var(--blue);">
                🔊 Escuchar Pronunciación
              </button>
            </div>
          </div>
        </div>
        <div class="fc-controls">
          <button class="icon-action-btn" onclick="slideCard(-1)">◀ Anterior</button>
          <span style="font-weight:800; color:var(--text-muted); font-size:1.1rem;">${cardPointer + 1} / ${items.length}</span>
          <button class="icon-action-btn" onclick="slideCard(1)">Siguiente ▶</button>
        </div>
      `;
    }

    function slideCard(delta) {
      const items = COMPREHENSIVE_DATABASE[currentActiveLesson].items;
      cardPointer = (cardPointer + delta + items.length) % items.length;
      renderCardFace(document.getElementById('gameArena'));
    }

    // ==========================================
    // JUEGO 2: TRÍOS IGUALES (21 CARTAS)
    // ==========================================
    let trioSelection = [];
    let trioSolvedCount = 0;

    function setupTrioGame(arena) {
      trioSelection = [];
      trioSolvedCount = 0;
      const items = COMPREHENSIVE_DATABASE[currentActiveLesson].items.slice(0, 7);
      
      let deck = [];
      items.forEach(it => {
        deck.push({ ...it }, { ...it }, { ...it });
      });
      deck.sort(() => Math.random() - 0.5);

      arena.innerHTML = `
        <div class="trio-board-wrap">
          <p style="color:var(--text-muted); font-size:1.15rem; font-weight:600;">
            Encuentra los <b>3 iguales</b> para eliminarlos (7 grupos de 3):
          </p>
          <div class="trio-grid" id="trioGrid"></div>
        </div>
      `;

      const grid = document.getElementById('trioGrid');
      deck.forEach((card, idx) => {
        const node = document.createElement('div');
        node.className = 'trio-card';
        node.dataset.icon = card.icon;
        node.dataset.name = card.es;
        node.innerText = '❓';
        node.onclick = () => onTrioCardClick(node, card);
        grid.appendChild(node);
      });
    }

    function onTrioCardClick(node, card) {
      if (node.classList.contains('revealed') || node.classList.contains('matched') || trioSelection.length >= 3) return;

      node.classList.add('revealed');
      node.innerText = card.icon;
      trioSelection.push(node);

      if (trioSelection.length === 3) {
        const [a, b, c] = trioSelection;
        if (a.dataset.icon === b.dataset.icon && b.dataset.icon === c.dataset.icon) {
          setTimeout(() => {
            trioSelection.forEach(n => n.classList.add('matched'));
            trioSelection = [];
            trioSolvedCount++;
            playAudioChime('success');
            awardPoints(50);
            displayToast("¡Trío completado! ¡Memoria de campeón! 🌟");

            if (trioSolvedCount === 7) {
              setTimeout(() => {
                showGameVictory("¡Excelente, has limpiado todo el tablero de tríos!");
              }, 600);
            }
          }, 350);
        } else {
          setTimeout(() => {
            trioSelection.forEach(n => {
              n.classList.remove('revealed');
              n.innerText = '❓';
            });
            trioSelection = [];
            displayToast("¡Casi lo logras! La perseverancia es la clave. ¡Inténtalo de nuevo!", true);
          }, 850);
        }
      }
    }

    // ==========================================
    // JUEGO 3: COMPLETAR 4 FRASES EN CADENA
    // ==========================================
    let sentenceStage = 0;
    function setupSentenceGame(arena) {
      sentenceStage = 0;
      displayCurrentSentence(arena);
    }

    function displayCurrentSentence(arena) {
      const sentences = COMPREHENSIVE_DATABASE[currentActiveLesson].sentences;
      const s = sentences[sentenceStage];

      arena.innerHTML = `
        <div class="fill-sentence-box">
          <div class="step-counter">Frase ${sentenceStage + 1} de 4</div>
          <div class="sentence-lead-icon">${s.icon}</div>
          <div class="sentence-stream">
            ${s.before}<span class="pill-slot" id="slotWord">______</span>${s.after}
          </div>
          <div class="answer-chips" id="chipsBox">
            ${s.opts.map(opt => `
              <button class="chip-btn" onclick="verifySentenceChoice('${opt}', '${s.answer}')">${opt}</button>
            `).join('')}
          </div>
        </div>
      `;
    }

    function verifySentenceChoice(chosen, correct) {
      const slot = document.getElementById('slotWord');
      if (chosen.toLowerCase() === correct.toLowerCase()) {
        slot.innerText = chosen;
        slot.classList.add('filled');
        pronounceWord(chosen);
        playAudioChime('success');
        awardPoints(50);

        displayToast("¡Excelente trabajo, estás progresando! 🔥");
        document.querySelectorAll('.chip-btn').forEach(b => b.style.pointerEvents = 'none');

        setTimeout(() => {
          sentenceStage++;
          const sentences = COMPREHENSIVE_DATABASE[currentActiveLesson].sentences;
          if (sentenceStage < sentences.length) {
            displayCurrentSentence(document.getElementById('gameArena'));
          } else {
            showGameVictory("¡Misión Cumplida: Completaste las 4 frases con éxito total!");
          }
        }, 1400);

      } else {
        displayToast("¡Buen intento! Respira y persevera, prueba otra opción.", true);
      }
    }

    // ==========================================
    // JUEGO 4: UNIR 8 PAREJAS EN 2 RONDAS
    // ==========================================
    let matchRound = 1;
    let chosenMatchNode = null;
    let roundPairsSolved = 0;

    function setupMatchingGame(arena) {
      matchRound = 1;
      chosenMatchNode = null;
      roundPairsSolved = 0;
      buildMatchRound(arena);
    }

    function buildMatchRound(arena) {
      roundPairsSolved = 0;
      chosenMatchNode = null;
      const allItems = COMPREHENSIVE_DATABASE[currentActiveLesson].items;
      const roundItems = matchRound === 1 ? allItems.slice(0, 4) : allItems.slice(4, 8);
      const shuffledNames = [...roundItems].sort(() => Math.random() - 0.5);

      arena.innerHTML = `
        <div class="match-arena">
          <div class="match-hud-bar">
            <span style="color:var(--orange); font-weight:800; font-size:1.15rem;">
              Ronda ${matchRound} de 2 (4 Parejas)
            </span>
            <span style="color:var(--text-muted); font-size:0.95rem;">
              Toca el dibujo y luego su nombre
            </span>
          </div>

          <div class="match-columns">
            <div class="match-col">
              ${roundItems.map(it => `
                <div class="match-cell icon-cell" data-link="${it.es}" onclick="onMatchCellClick(this, 'left')">
                  ${it.icon}
                </div>
              `).join('')}
            </div>
            <div class="match-col">
              ${shuffledNames.map(it => `
                <div class="match-cell word-cell" data-link="${it.es}" onclick="onMatchCellClick(this, 'right')">
                  ${it.es}
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function onMatchCellClick(cell, side) {
      if (cell.classList.contains('correct')) return;

      if (!chosenMatchNode) {
        chosenMatchNode = { cell, side };
        cell.classList.add('selected');
      } else {
        if (chosenMatchNode.side === side) {
          chosenMatchNode.cell.classList.remove('selected');
          chosenMatchNode = { cell, side };
          cell.classList.add('selected');
        } else {
          if (chosenMatchNode.cell.dataset.link === cell.dataset.link) {
            cell.classList.add('correct');
            chosenMatchNode.cell.classList.add('correct');
            chosenMatchNode.cell.classList.remove('selected');
            pronounceWord(cell.dataset.link);
            playAudioChime('success');
            awardPoints(25);
            roundPairsSolved++;
            chosenMatchNode = null;

            displayToast("¡Conexión perfecta! 🎯");

            if (roundPairsSolved === 4) {
              setTimeout(() => {
                if (matchRound === 1) {
                  matchRound = 2;
                  displayToast("¡Ronda 1 lista! Preparando Ronda 2...");
                  buildMatchRound(document.getElementById('gameArena'));
                } else {
                  showGameVictory("¡Excelente, has completado esta misión de 8 parejas!");
                }
              }, 1000);
            }
          } else {
            chosenMatchNode.cell.classList.remove('selected');
            chosenMatchNode = null;
            displayToast("No coinciden esta vez. ¡Respira y vuelve a intentar!", true);
          }
        }
      }
    }

    // ==========================================
    // PANTALLA DE VICTORIA FINAL DEL JUEGO
    // ==========================================
    function showGameVictory(message) {
      haltTimer();
      playAudioChime('fanfare');
      awardPoints(100);

      const m = Math.floor(timerTotalSeconds / 60);
      const s = timerTotalSeconds % 60;
      const displayTime = m > 0 ? `${m}m ${s}s` : `${s} segundos`;

      const arena = document.getElementById('gameArena');
      arena.innerHTML = `
        <div class="victory-box">
          <div class="trophy-bounce">🏆</div>
          <div class="victory-title">${message}</div>
          <div class="time-stat">⏱️ ¡Excelente tiempo: ${displayTime}!</div>
          <p style="color:var(--text-muted); font-size:1.2rem; margin-bottom:28px;">
            ¡Gran concentración y reflejos de titán!
          </p>
          <button class="chip-btn" onclick="loadGame(1)" style="background:var(--orange); border-color:var(--orange);">
            Jugar otra misión 🚀
          </button>
        </div>
      `;
    }

    window.onload = startApp;
  </script>
